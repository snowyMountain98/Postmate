name: Update Stamp Data

on:
  schedule:
    - cron: "15 10 * * 3"
      timezone: "Asia/Seoul"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    name: Update Stamp Data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Diagnose stamp.epost.go.kr connection
        run: |
          set +e

          echo "========================================"
          echo "stamp.epost.go.kr 연결 진단"
          echo "========================================"

          echo ""
          echo "=== DNS ==="
          getent hosts stamp.epost.go.kr
          echo "DNS exit code: $?"

          echo ""
          echo "=== IPv4 CURL ==="
          curl -4 -L -v --connect-timeout 30 --max-time 60 \
            -A "Mozilla/5.0" \
            -o /tmp/stamp-ipv4.html \
            "https://stamp.epost.go.kr/sp2/sg/spsg0101.jsp"
          IPV4_CODE=$?
          echo "IPv4 curl exit code: $IPV4_CODE"
          if [ -f /tmp/stamp-ipv4.html ]; then
            echo "IPv4 response size: $(wc -c < /tmp/stamp-ipv4.html) bytes"
          fi

          echo ""
          echo "=== IPv6 CURL ==="
          curl -6 -L -v --connect-timeout 30 --max-time 60 \
            -A "Mozilla/5.0" \
            -o /tmp/stamp-ipv6.html \
            "https://stamp.epost.go.kr/sp2/sg/spsg0101.jsp"
          IPV6_CODE=$?
          echo "IPv6 curl exit code: $IPV6_CODE"
          if [ -f /tmp/stamp-ipv6.html ]; then
            echo "IPv6 response size: $(wc -c < /tmp/stamp-ipv6.html) bytes"
          fi

          echo ""
          echo "=== CURL RESULT SUMMARY ==="
          echo "IPv4 curl exit code: $IPV4_CODE"
          echo "IPv6 curl exit code: $IPV6_CODE"
          echo ""
          echo "진단 단계는 결과와 관계없이 계속 진행합니다."

      - name: Crawl New Stamps
        env:
          MAX_PAGES: "0"
          CONCURRENCY: "3"
          REQUEST_DELAY: "500"
          MAX_RETRIES: "3"
        run: |
          node scripts/crawl-stamps.js

      - name: Generate AI Keywords
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: "gpt-5-mini"
          BATCH_SIZE: "20"
          CONCURRENCY: "5"
          REQUEST_DELAY: "500"
          MAX_RETRIES: "3"
          REGENERATE_ALL: "false"
        run: |
          node scripts/generate-keywords.js

      - name: Commit Stamp Data
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add stamp-data.json

          if git diff --cached --quiet; then
            echo "변경된 우표 데이터가 없습니다."
          else
            git commit -m "Update stamp data"

            git push \
              https://${GH_PAT}@github.com/${GITHUB_REPOSITORY}.git \
              HEAD:${GITHUB_REF_NAME}
          fi