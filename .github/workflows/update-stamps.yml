name: Update Stamp Data

on:

  workflow_dispatch:

  schedule:
    - cron: "0 0 1 * *"


jobs:

  update-stamps:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20


      - name: Install dependencies
        run: npm install


      - name: Crawl K-stamp
        run: node scripts/crawl-stamps.js


      - name: Commit updated data
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add stamp-data.json

          git diff --cached --quiet || \
            git commit -m "Update stamp data"

          git push