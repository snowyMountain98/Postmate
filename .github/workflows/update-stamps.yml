name: Update Stamp Data

on:
  schedule:
    - cron: "15 10 * * 3"
      timezone: "Asia/Seoul"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    name: Update Stamp Data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Crawl New Stamps
        env:
          NODE_OPTIONS: "--dns-result-order=ipv4first"
          MAX_PAGES: "0"
          CONCURRENCY: "3"
          REQUEST_DELAY: "500"
          MAX_RETRIES: "3"
        run: |
          node scripts/crawl-stamps.js

      - name: Generate AI Keywords
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: "gpt-5-mini"
          BATCH_SIZE: "20"
          CONCURRENCY: "5"
          REQUEST_DELAY: "500"
          MAX_RETRIES: "3"
          REGENERATE_ALL: "false"
        run: |
          node scripts/generate-keywords.js

      - name: Commit Stamp Data
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add stamp-data.json

          if git diff --cached --quiet; then
            echo "변경된 우표 데이터가 없습니다."
          else
            git commit -m "Update stamp data"

            git push \
              https://${GH_PAT}@github.com/${GITHUB_REPOSITORY}.git \
              HEAD:${GITHUB_REF_NAME}
          fi