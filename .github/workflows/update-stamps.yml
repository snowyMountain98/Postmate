name: Update Stamp Data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Test K-stamp connection
        run: |
          echo "========================================"
          echo "K-stamp 연결 테스트"
          echo "========================================"

          echo ""
          echo "===== DNS ====="
          getent hosts stamp.epost.go.kr || true

          echo ""
          echo "===== HTTPS ====="

          curl -I \
            --connect-timeout 15 \
            --max-time 30 \
            https://stamp.epost.go.kr/sp2/sg/spsg0101.jsp

      - name: Crawl K-stamp
        env:
          MAX_PAGES: "2"
          CONCURRENCY: "1"
          REQUEST_DELAY: "1500"
          MAX_RETRIES: "3"
        run: node scripts/crawl-stamps.js

      - name: Validate stamp data
        run: |
          node - <<'NODE'
          const fs = require("fs");

          const data = JSON.parse(
            fs.readFileSync("stamp-data.json", "utf8")
          );

          if (!Array.isArray(data)) {
            throw new Error("stamp-data.json이 배열이 아닙니다.");
          }

          if (data.length === 0) {
            throw new Error("수집된 우표 데이터가 없습니다.");
          }

          console.log(`우표 데이터 ${data.length}개 확인`);
          NODE

      - name: Commit stamp data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add stamp-data.json

          if git diff --cached --quiet; then
            echo "변경사항 없음"
          else
            git commit -m "Update stamp data"
            git push
          fi