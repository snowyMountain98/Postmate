name: Update Stamp Data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  crawl:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Crawl K-stamp
        env:
          MAX_PAGES: "2"
          CONCURRENCY: "3"
          REQUEST_DELAY: "500"
        run: node scripts/crawl-stamps.js

      - name: Show result
        run: |
          echo "===== stamp-data.json ====="

          echo "파일 크기:"
          wc -c stamp-data.json

          echo "우표 개수:"
          node -e "const d=require('./stamp-data.json'); console.log(d.length)"

      - name: Commit updated data
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add stamp-data.json

          if git diff --cached --quiet; then
            echo "변경사항 없음"
          else
            git commit -m "Update stamp data"
            git push
          fi