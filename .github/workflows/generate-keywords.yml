name: Generate Stamp Keywords

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Generate AI keywords
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BATCH_SIZE: "1000"
          REQUEST_DELAY: "3000"
          MAX_RETRIES: "3"
        run: node scripts/generate-keywords.js

      - name: Show result
        run: |
          node - <<'NODE'
          const fs = require("fs");

          const data = JSON.parse(
            fs.readFileSync("stamp-data.json", "utf8")
          );

          const completed = data.filter(
            stamp =>
              Array.isArray(stamp.keywords) &&
              stamp.keywords.length > 0
          );

          console.log(`전체 우표: ${data.length}`);
          console.log(`키워드 생성 완료: ${completed.length}`);
          console.log(`키워드 미생성: ${data.length - completed.length}`);
          NODE

      - name: Commit keywords
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add stamp-data.json

          if git diff --cached --quiet; then
            echo "변경사항 없음"
          else
            git commit -m "Generate stamp keywords"
            git push
          fi