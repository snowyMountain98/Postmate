name: Generate Stamp Keywords

on:
  workflow_run:
    workflows:
      - Update Stamp Data
    types:
      - completed

permissions:
  contents: write

jobs:

  generate:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Generate AI keywords
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

          BATCH_SIZE: "20"
          REQUEST_DELAY: "1000"
          MAX_RETRIES: "3"

        run: |
          node scripts/generate-keywords.js

      - name: Validate keywords
        run: |
          node - <<'NODE'
          const fs = require("fs");

          const data = JSON.parse(
            fs.readFileSync("stamp-data.json", "utf8")
          );

          if (!Array.isArray(data)) {
            throw new Error("stamp-data.json이 배열이 아닙니다.");
          }

          const completed = data.filter(
            stamp =>
              Array.isArray(stamp.keywords) &&
              stamp.keywords.length > 0
          );

          console.log(`전체 우표: ${data.length}`);
          console.log(`키워드 생성 완료: ${completed.length}`);
          console.log(`키워드 미생성: ${data.length - completed.length}`);

          if (completed.length === 0) {
            throw new Error("생성된 키워드가 없습니다.");
          }
          NODE

      - name: Commit keywords
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add stamp-data.json

          if git diff --cached --quiet; then
            echo "변경사항 없음"
          else
            git commit -m "Generate stamp keywords"
            git push
          fi