name: Generate Stamp Keywords

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  generate:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Generate AI keywords
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

          # 한 번 실행할 때 처리할 우표 수
          BATCH_SIZE: "20"

          # API 요청 간 대기시간
          REQUEST_DELAY: "1000"

          # API 오류 재시도
          MAX_RETRIES: "3"

        run: |
          node scripts/generate-keywords.js

      - name: Show result
        run: |

          echo "===== 결과 ====="

          echo "전체 우표:"
          node -e "const d=require('./stamp-data.json'); console.log(d.length)"

          echo "키워드 생성 완료:"
          node -e "const d=require('./stamp-data.json'); console.log(d.filter(x => Array.isArray(x.keywords) && x.keywords.length > 0).length)"

          echo "키워드 미생성:"
          node -e "const d=require('./stamp-data.json'); console.log(d.filter(x => !Array.isArray(x.keywords) || x.keywords.length === 0).length)"

      - name: Commit updated keywords
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add stamp-data.json

          if git diff --cached --quiet; then
            echo "변경사항 없음"
          else
            git commit -m "Generate stamp keywords"
            git push
          fi