<!DOCTYPE html>

<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우표 검색</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="header"></div>

    <div class="container">

        <h1 class="search-title">📮 우표 검색</h1>

        <div class="search-box">
            <input id="searchInput" class="search-input" type="text" inputmode="search" placeholder="우표를 검색해보세요"
                autocomplete="off">

            <button type="button" class="search-button" onclick="searchStamps()">
                🔍 검색
            </button>
        </div>

        <div class="color-filter">
            <div class="color-filter-header">
                <span class="color-filter-title">🎨 색상 필터</span>
                <button type="button" id="clearColorFilter" class="color-filter-clear" onclick="clearColorFilters()">
                    초기화
                </button>
            </div>
            <div id="colorFilterList" class="color-filter-list"></div>
        </div>

        <div id="searchInfo" class="search-info">
            우표 데이터를 불러오는 중...
        </div>

        <div id="relatedKeywords" class="related-keywords"></div>

        <div id="stampList" class="stamp-list">
            <div class="loading">
                📮 우표 정보를 불러오는 중...
            </div>
        </div>

    </div>


    <script>

        let stamps = [];
        let currentResults = [];
        let displayedCount = 0;
        const selectedColors = new Set();

        const STAMPS_PER_PAGE = 10;
        let isLoadingMore = false;

        const colorDefinitions = [
            { name: "빨강", className: "red", aliases: ["빨강"] },
            { name: "파랑", className: "blue", aliases: ["파랑"] },
            { name: "노랑", className: "yellow", aliases: ["노랑"] },
            { name: "초록", className: "green", aliases: ["초록", "녹색"] },
            { name: "주황", className: "orange", aliases: ["주황"] },
            { name: "분홍", className: "pink", aliases: ["분홍"] },
            { name: "보라", className: "purple", aliases: ["보라"] },
            { name: "갈색", className: "brown", aliases: ["갈색"] },
            { name: "검정", className: "black", aliases: ["검정"] },
            { name: "흰색", className: "white", aliases: ["흰색"] },
            { name: "회색", className: "gray", aliases: ["회색"] },
            { name: "금색", className: "gold", aliases: ["금색"] },
            { name: "은색", className: "silver", aliases: ["은색"] }
        ];

        const colorMap = Object.fromEntries(
            colorDefinitions.flatMap(color =>
                color.aliases.map(alias => [alias, color.className])
            )
        );

        // ========================================
        // 우표 데이터 불러오기
        // ========================================

        async function loadStamps() {

            try {

                const response =
                    await fetch("./stamp-data.json");

                if (!response.ok) {
                    throw new Error(
                        "stamp-data.json을 불러오지 못했습니다."
                    );
                }

                stamps = await response.json();

                displayStamps(stamps);

                showRelatedKeywords();

            } catch (error) {

                console.error(error);

                document.getElementById(
                    "searchInfo"
                ).textContent =
                    "우표 데이터를 불러오지 못했어요.";

                document.getElementById(
                    "stampList"
                ).innerHTML =
                    '<div class="no-result">' +
                    'stamp-data.json 파일이 같은 폴더에 있는지 확인해주세요.' +
                    '</div>';

            }

        }


        // ========================================
        // 우표 검색
        // ========================================

        function searchStamps() {
            const keyword = document
                .getElementById("searchInput")
                .value
                .trim()
                .toLowerCase();

            const colorFilteredStamps = stamps.filter(stamp =>
                matchesSelectedColors(stamp)
            );

            if (!keyword) {
                displayStamps(colorFilteredStamps);
                return;
            }

            const results = colorFilteredStamps
                .map(stamp => {

                    const design = String(stamp.design || "").toLowerCase();
                    const title = String(stamp.title || "").toLowerCase();

                    const keywords = Array.isArray(stamp.keywords)
                        ? stamp.keywords.join(" ").toLowerCase()
                        : "";

                    const description = String(
                        stamp.description || ""
                    ).toLowerCase();

                    const other = [
                        stamp.issueDate,
                        stamp.faceValue,
                        stamp.size,
                        stamp.id
                    ]
                        .filter(Boolean)
                        .join(" ")
                        .toLowerCase();


                    let score = 0;


                    // ========================================
                    // 1순위 : 디자인
                    // ========================================

                    if (design.includes(keyword)) {
                        score += 500;

                        // 정확히 일치하면 추가 점수
                        if (design === keyword) {
                            score += 100;
                        }
                    }


                    // ========================================
                    // 2순위 : 제목
                    // ========================================

                    if (title.includes(keyword)) {
                        score += 400;

                        if (title === keyword) {
                            score += 100;
                        }
                    }


                    // ========================================
                    // 3순위 : 태그
                    // ========================================

                    if (keywords.includes(keyword)) {
                        score += 300;

                        // 태그 하나가 검색어와 정확히 일치
                        const exactKeyword = (
                            stamp.keywords || []
                        ).some(
                            tag =>
                                String(tag)
                                    .toLowerCase()
                                    .trim() === keyword
                        );

                        if (exactKeyword) {
                            score += 100;
                        }
                    }


                    // ========================================
                    // 4순위 : 상세 설명
                    // ========================================

                    if (description.includes(keyword)) {
                        score += 200;
                    }


                    // ========================================
                    // 5순위 : 기타 정보
                    // ========================================

                    if (other.includes(keyword)) {
                        score += 100;
                    }


                    return {
                        stamp,
                        score
                    };
                })

                // 검색어가 하나도 없는 우표 제거
                .filter(item => item.score > 0)

                // 점수가 높은 순서
                .sort((a, b) => b.score - a.score)

                // 우표 데이터만 반환
                .map(item => item.stamp);


            displayStamps(results);
        }


        // ========================================
        // 우표 목록 표시
        // ========================================

        function displayStamps(results) {
            const list = document.getElementById("stampList");
            const info = document.getElementById("searchInfo");
            const keyword = document.getElementById("searchInput").value.trim();

            currentResults = results;
            displayedCount = 0;

            list.innerHTML = "";

            const selectedColorNames = colorDefinitions
                .filter(color => selectedColors.has(color.name))
                .map(color => color.name);

            const colorText = selectedColorNames.length
                ? ` · ${selectedColorNames.join(" + ")} 필터`
                : "";

            if (keyword) {
                info.textContent = `"${keyword}" 검색 결과 ${results.length}개${colorText}`;
            } else if (selectedColorNames.length) {
                info.textContent = `${selectedColorNames.join(" + ")} 필터 결과 ${results.length}개`;
            } else {
                info.textContent = `전체 우표 ${results.length}개`;
            }

            if (results.length === 0) {
                list.innerHTML =
                    '<div class="no-result">🔎 검색 결과가 없어요.<br><br>다른 검색어를 입력해보세요.</div>';
                return;
            }

            loadMoreStamps();

            if (keyword) {
                list.scrollIntoView({
                    behavior: "smooth",
                    block: "start"
                });
            }
        }

        function loadMoreStamps() {
            if (isLoadingMore) {
                return;
            }

            if (displayedCount >= currentResults.length) {
                return;
            }

            isLoadingMore = true;

            const list = document.getElementById("stampList");

            const nextItems = currentResults.slice(
                displayedCount,
                displayedCount + STAMPS_PER_PAGE
            );

            nextItems.forEach(stamp => {
                const card = document.createElement("div");
                card.className = "stamp-card";

                const colorKeywords = new Set(Object.keys(colorMap));

                const tags = (stamp.keywords || [])
                    .map(keyword => {
                        const normalizedKeyword = String(keyword).trim();

                        if (colorKeywords.has(normalizedKeyword)) {
                            return `
                                <span class="stamp-color-tag" title="${normalizedKeyword}" aria-label="${normalizedKeyword}">
                                    <span class="stamp-color-dot stamp-color-${colorMap[normalizedKeyword]}" aria-hidden="true"></span>
                                </span>
                            `;
                        }

                        return `<span class="stamp-tag">#${normalizedKeyword}</span>`;
                    })
                    .join("");

                card.innerHTML = `
            <div class="stamp-card-content">

                <div class="stamp-image-wrap">
                    ${stamp.image
                        ? `<img
                                class="stamp-image"
                                src="${stamp.image}"
                                alt="${stamp.title || "우표"}"
                                loading="lazy"
                              >`
                        : `<div class="stamp-image-empty">📮</div>`
                    }
                </div>

                <div class="stamp-info">

                    <h2 class="stamp-title">
                        ${stamp.title || "제목 없음"}
                    </h2>

                    <div class="stamp-design">
                        ${stamp.design || ""}
                    </div>

                    <div class="stamp-meta">
                        <div>
                            📅 ${stamp.issueDate || "-"}
                        </div>

                        <div>
                            💰 ${stamp.faceValue || "-"}
                        </div>

                        <div>
                            📐 ${stamp.size || "-"}
                        </div>
                    </div>

                </div>

            </div>

            <div class="stamp-tags">
                ${tags}
            </div>
        `;

                list.appendChild(card);
            });

            displayedCount += nextItems.length;

            isLoadingMore = false;
        }

        // ========================================
        // 색상 필터
        // ========================================

        function renderColorFilters() {
            const container = document.getElementById("colorFilterList");

            container.innerHTML = colorDefinitions
                .map(color => `
                    <button
                        type="button"
                        class="color-filter-button"
                        data-color="${color.name}"
                        title="${color.aliases.join(" / ")}"
                        aria-label="${color.aliases.join(" / ")} 색상 필터"
                        aria-pressed="false"
                        onclick="toggleColorFilter('${color.name}')"
                    >
                        <span class="stamp-color-dot stamp-color-${color.className}" aria-hidden="true"></span>
                    </button>
                `)
                .join("");

            updateColorFilterUI();
        }

        function toggleColorFilter(colorName) {
            if (selectedColors.has(colorName)) {
                selectedColors.delete(colorName);
            } else {
                selectedColors.add(colorName);
            }

            updateColorFilterUI();
            searchStamps();
        }

        function clearColorFilters() {
            selectedColors.clear();
            updateColorFilterUI();
            searchStamps();
        }

        function updateColorFilterUI() {
            document.querySelectorAll(".color-filter-button").forEach(button => {
                const colorName = button.dataset.color;
                const isSelected = selectedColors.has(colorName);

                button.classList.toggle("selected", isSelected);
                button.setAttribute("aria-pressed", String(isSelected));
            });

            const clearButton = document.getElementById("clearColorFilter");
            clearButton.disabled = selectedColors.size === 0;
        }

        function matchesSelectedColors(stamp) {
            if (selectedColors.size === 0) {
                return true;
            }

            const stampColors = new Set(
                (stamp.keywords || []).map(keyword =>
                    String(keyword).trim()
                )
            );

            return colorDefinitions
                .filter(color => selectedColors.has(color.name))
                .every(color =>
                    color.aliases.some(alias => stampColors.has(alias))
                );
        }

        // ========================================
        // 관련 키워드
        // ========================================

        function showRelatedKeywords() {

            const container =
                document.getElementById(
                    "relatedKeywords"
                );

            container.innerHTML = "";

        }


        // ========================================
        // HTML 특수문자 처리
        // ========================================

        function escapeHtml(value) {

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        // ========================================
        // Enter 검색
        // ========================================

        document
            .getElementById("searchInput")
            .addEventListener(
                "keydown",
                function (event) {

                    if (event.key === "Enter") {

                        event.preventDefault();

                        searchStamps();

                    }

                }
            );


        // ========================================
        // 공통 Header
        // ========================================

        async function loadHeader() {

            try {

                const response =
                    await fetch("./header.html");

                if (!response.ok) {

                    throw new Error(
                        "header.html을 불러오지 못했습니다."
                    );

                }

                const data =
                    await response.text();

                document.getElementById(
                    "header"
                ).innerHTML = data;


            } catch (error) {

                console.error(error);

            }

        }


        // ========================================
        // 초기 실행
        // ========================================

        loadHeader();
        renderColorFilters();

        loadStamps();

        window.addEventListener("scroll", function () {

            const scrollPosition =
                window.innerHeight + window.scrollY;

            const documentHeight =
                document.documentElement.scrollHeight;

            // 페이지 하단 300px 전에 다음 10개 로딩
            if (
                scrollPosition >= documentHeight - 300
            ) {
                loadMoreStamps();
            }
        });
    </script>

</body>

</html>
