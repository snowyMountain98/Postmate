<!DOCTYPE html>

<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우표 검색</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="header"></div>

    <div class="container">

        <h1 class="search-title">📮 우표 검색</h1>

        <div class="search-box">
            <input id="searchInput" class="search-input" type="text" inputmode="search" placeholder="우표를 검색해보세요"
                autocomplete="off">

            <button type="button" class="search-button" onclick="searchStamps()">
                🔍 검색
            </button>
        </div>

        <div id="searchInfo" class="search-info">
            우표 데이터를 불러오는 중...
        </div>

        <div id="relatedKeywords" class="related-keywords"></div>

        <div id="stampList" class="stamp-list">
            <div class="loading">
                📮 우표 정보를 불러오는 중...
            </div>
        </div>

    </div>


    <script>

        let stamps = [];
        let currentResults = [];
        let displayedCount = 0;

        const STAMPS_PER_PAGE = 10;
        let isLoadingMore = false;

        // ========================================
        // 우표 데이터 불러오기
        // ========================================

        async function loadStamps() {

            try {

                const response =
                    await fetch("./stamp-data.json");

                if (!response.ok) {
                    throw new Error(
                        "stamp-data.json을 불러오지 못했습니다."
                    );
                }

                stamps = await response.json();

                displayStamps(stamps);

                showRelatedKeywords();

            } catch (error) {

                console.error(error);

                document.getElementById(
                    "searchInfo"
                ).textContent =
                    "우표 데이터를 불러오지 못했어요.";

                document.getElementById(
                    "stampList"
                ).innerHTML =
                    '<div class="no-result">' +
                    'stamp-data.json 파일이 같은 폴더에 있는지 확인해주세요.' +
                    '</div>';

            }

        }


        // ========================================
        // 우표 검색
        // ========================================

        function searchStamps() {
            const keyword = document
                .getElementById("searchInput")
                .value
                .trim()
                .toLowerCase();

            if (!keyword) {
                displayStamps(stamps);
                return;
            }

            const results = stamps
                .map(stamp => {

                    const design = String(stamp.design || "").toLowerCase();
                    const title = String(stamp.title || "").toLowerCase();

                    const keywords = Array.isArray(stamp.keywords)
                        ? stamp.keywords.join(" ").toLowerCase()
                        : "";

                    const description = String(
                        stamp.description || ""
                    ).toLowerCase();

                    const other = [
                        stamp.issueDate,
                        stamp.faceValue,
                        stamp.size,
                        stamp.id
                    ]
                        .filter(Boolean)
                        .join(" ")
                        .toLowerCase();


                    let score = 0;


                    // ========================================
                    // 1순위 : 디자인
                    // ========================================

                    if (design.includes(keyword)) {
                        score += 500;

                        // 정확히 일치하면 추가 점수
                        if (design === keyword) {
                            score += 100;
                        }

                        // 앞부분에 있으면 추가 점수
                        if (design.startsWith(keyword)) {
                            score += 50;
                        }
                    }


                    // ========================================
                    // 2순위 : 제목
                    // ========================================

                    if (title.includes(keyword)) {
                        score += 400;

                        if (title === keyword) {
                            score += 100;
                        }

                        if (title.startsWith(keyword)) {
                            score += 50;
                        }
                    }


                    // ========================================
                    // 3순위 : 태그
                    // ========================================

                    if (keywords.includes(keyword)) {
                        score += 300;

                        // 태그 하나가 검색어와 정확히 일치
                        const exactKeyword = (
                            stamp.keywords || []
                        ).some(
                            tag =>
                                String(tag)
                                    .toLowerCase()
                                    .trim() === keyword
                        );

                        if (exactKeyword) {
                            score += 100;
                        }
                    }


                    // ========================================
                    // 4순위 : 상세 설명
                    // ========================================

                    if (description.includes(keyword)) {
                        score += 200;
                    }


                    // ========================================
                    // 5순위 : 기타 정보
                    // ========================================

                    if (other.includes(keyword)) {
                        score += 100;
                    }


                    return {
                        stamp,
                        score
                    };
                })

                // 검색어가 하나도 없는 우표 제거
                .filter(item => item.score > 0)

                // 점수가 높은 순서
                .sort((a, b) => b.score - a.score)

                // 우표 데이터만 반환
                .map(item => item.stamp);


            displayStamps(results);
        }


        // ========================================
        // 우표 목록 표시
        // ========================================

        function displayStamps(results) {
            const list = document.getElementById("stampList");
            const info = document.getElementById("searchInfo");
            const keyword = document.getElementById("searchInput").value.trim();

            currentResults = results;
            displayedCount = 0;

            list.innerHTML = "";

            if (keyword) {
                info.textContent = `"${keyword}" 검색 결과 ${results.length}개`;
            } else {
                info.textContent = `전체 우표 ${results.length}개`;
            }

            if (results.length === 0) {
                list.innerHTML =
                    '<div class="no-result">🔎 검색 결과가 없어요.<br><br>다른 검색어를 입력해보세요.</div>';
                return;
            }

            loadMoreStamps();

            if (keyword) {
                list.scrollIntoView({
                    behavior: "smooth",
                    block: "start"
                });
            }
        }

        function loadMoreStamps() {
            if (isLoadingMore) {
                return;
            }

            if (displayedCount >= currentResults.length) {
                return;
            }

            isLoadingMore = true;

            const list = document.getElementById("stampList");

            const nextItems = currentResults.slice(
                displayedCount,
                displayedCount + STAMPS_PER_PAGE
            );

            nextItems.forEach(stamp => {
                const card = document.createElement("div");
                card.className = "stamp-card";

                const tags = (stamp.keywords || [])
                    .map(keyword =>
                        `<span class="stamp-tag">#${keyword}</span>`
                    )
                    .join("");

                card.innerHTML = `
            <div class="stamp-card-content">

                <div class="stamp-image-wrap">
                    ${stamp.image
                        ? `<img
                                class="stamp-image"
                                src="${stamp.image}"
                                alt="${stamp.title || "우표"}"
                                loading="lazy"
                              >`
                        : `<div class="stamp-image-empty">📮</div>`
                    }
                </div>

                <div class="stamp-info">

                    <h2 class="stamp-title">
                        ${stamp.title || "제목 없음"}
                    </h2>

                    <div class="stamp-design">
                        ${stamp.design || ""}
                    </div>

                    <div class="stamp-meta">
                        <div>
                            발행일 : ${stamp.issueDate || "-"}
                        </div>

                        <div>
                            액면가격 : ${stamp.faceValue || "-"}
                        </div>

                        <div>
                            크기 : ${stamp.size || "-"}
                        </div>
                    </div>

                </div>

            </div>

            <div class="stamp-tags">
                ${tags}
            </div>
        `;

                list.appendChild(card);
            });

            displayedCount += nextItems.length;

            isLoadingMore = false;
        }

        // ========================================
        // 관련 키워드
        // ========================================

        function showRelatedKeywords() {

            const container =
                document.getElementById(
                    "relatedKeywords"
                );

            container.innerHTML = "";

        }


        // ========================================
        // HTML 특수문자 처리
        // ========================================

        function escapeHtml(value) {

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        // ========================================
        // Enter 검색
        // ========================================

        document
            .getElementById("searchInput")
            .addEventListener(
                "keydown",
                function (event) {

                    if (event.key === "Enter") {

                        event.preventDefault();

                        searchStamps();

                    }

                }
            );


        // ========================================
        // 공통 Header
        // ========================================

        async function loadHeader() {

            try {

                const response =
                    await fetch("./header.html");

                if (!response.ok) {

                    throw new Error(
                        "header.html을 불러오지 못했습니다."
                    );

                }

                const data =
                    await response.text();

                document.getElementById(
                    "header"
                ).innerHTML = data;


            } catch (error) {

                console.error(error);

            }

        }


        // ========================================
        // 초기 실행
        // ========================================

        loadHeader();

        loadStamps();

        window.addEventListener("scroll", function () {

            const scrollPosition =
                window.innerHeight + window.scrollY;

            const documentHeight =
                document.documentElement.scrollHeight;

            // 페이지 하단 300px 전에 다음 10개 로딩
            if (
                scrollPosition >= documentHeight - 300
            ) {
                loadMoreStamps();
            }
        });
    </script>

</body>

</html>
